name: 'The name of your action here'
description: 'Provide a description here'
author: 'Your name or organization here'

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: 'heart'
  color: 'red'

# Define your inputs here.
inputs:
  milliseconds:
    description: 'Your input description here'
    required: true
    default: '1000'
  token:
    description: 'github token'
    required: true
    default: ${{ github.token }}
  environment:
    description: 'Deployment environment: local, test, or production'
    required: false
    default: 'production'
  owner:
    description:
      'Repository owner (for local testing, auto-injected in GitHub Actions)'
    required: false
    default: ''
  repo:
    description:
      'Repository name (for local testing, auto-injected in GitHub Actions)'
    required: false
    default: ''
  run_id:
    description:
      'Workflow run ID (for local testing, auto-injected in GitHub Actions)'
    required: false
    default: ''
  status:
      description: '通知类型（success、failure、all、none），决定是否发送通知'
      required: false
      default: 'success'

# Define your outputs here.
outputs:
  time:
    description: 'Your output description here'

runs:
  using: node20
  main: dist/index.js
